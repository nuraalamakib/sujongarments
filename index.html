<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>মেসার্স সদর আলী এন্ড সন্স - ডিজিটাল ক্যাটালগ</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #0284c7;
            --primary-dark: #0369a1;
            --accent: #38bdf8;
            --bg-light: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --accent-green: #10b981;
            --shadow-sm: 0 2px 4px rgba(0, 0, 0, 0.04);
            --shadow-lg: 0 8px 20px rgba(0, 0, 0, 0.08);
            --radius-lg: 14px;
        }

        body.dark-mode {
            --bg-light: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --shadow-sm: 0 2px 4px rgba(0, 0, 0, 0.2);
            --shadow-lg: 0 8px 20px rgba(0, 0, 0, 0.35);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Hind Siliguri', sans-serif;
            -webkit-tap-highlight-color: transparent;
            transition: background-color 0.25s, color 0.25s, border-color 0.25s;
        }

        body {
            background-color: var(--bg-light);
            color: var(--text-main);
            padding-bottom: 40px;
        }

        /* Compact Mobile-First Header */
        header {
            background: linear-gradient(135deg, #0284c7, #0f172a);
            color: white;
            padding: 18px 14px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.12);
            position: relative;
        }

        .header-title {
            font-size: 20px;
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 2px;
            padding-right: 70px; /* Space for top buttons */
            text-align: left;
        }

        .header-subtitle {
            font-size: 12px;
            opacity: 0.9;
            font-weight: 400;
            text-align: left;
            padding-right: 70px;
        }

        .top-controls {
            position: absolute;
            top: 14px;
            right: 12px;
            display: flex;
            gap: 8px;
        }

        .icon-btn {
            background: rgba(255, 255, 255, 0.18);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            backdrop-filter: blur(6px);
        }

        .icon-btn:active {
            transform: scale(0.92);
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 12px;
        }

        /* Search Section UI */
        .search-card {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            padding: 12px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
            margin-bottom: 14px;
        }

        .search-box-wrapper {
            position: relative;
            width: 100%;
            margin-bottom: 10px;
        }

        .search-input {
            width: 100%;
            padding: 12px 82px 12px 14px;
            font-size: 15px;
            border: 1.5px solid var(--border-color);
            border-radius: 10px;
            background: var(--card-bg);
            color: var(--text-main);
            outline: none;
        }

        .search-input:focus {
            border-color: var(--primary);
        }

        /* Action Buttons inside Input */
        .clear-btn {
            position: absolute;
            right: 46px;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            color: var(--text-muted);
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            z-index: 2;
        }

        .voice-btn {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            background: var(--primary);
            color: white;
            border: none;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            z-index: 2;
        }

        .voice-btn.listening {
            background: #ef4444;
            animation: pulse 1.2s infinite;
        }

        @keyframes pulse {
            0% { transform: translateY(-50%) scale(1); }
            50% { transform: translateY(-50%) scale(1.08); }
            100% { transform: translateY(-50%) scale(1); }
        }

        /* Autocomplete Suggestions Overlay Dropdown */
        .autocomplete-dropdown {
            position: absolute;
            top: calc(100% + 4px);
            left: 0;
            right: 0;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
            z-index: 1000;
            max-height: 220px;
            overflow-y: auto;
            display: none;
        }

        .suggestion-item {
            padding: 10px 14px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13.5px;
            border-bottom: 1px solid var(--border-color);
        }

        .suggestion-item:last-child {
            border-bottom: none;
        }

        .suggestion-badge {
            font-size: 10px;
            padding: 2px 7px;
            background: var(--border-color);
            border-radius: 10px;
            color: var(--text-muted);
        }

        /* Horizontal Scrollable Filter Tags */
        .filter-tags {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 2px;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }

        .filter-tags::-webkit-scrollbar {
            display: none;
        }

        .tag {
            padding: 6px 14px;
            background: var(--bg-light);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            font-size: 12.5px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            user-select: none;
            flex-shrink: 0;
        }

        .tag.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        /* Stats Bar */
        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 12.5px;
            color: var(--text-muted);
            padding: 0 2px;
        }

        .sync-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: rgba(16, 185, 129, 0.12);
            color: var(--accent-green);
            padding: 3px 9px;
            border-radius: 12px;
            font-size: 11.5px;
            font-weight: 600;
        }

        .sync-dot {
            width: 6px;
            height: 6px;
            background-color: var(--accent-green);
            border-radius: 50%;
            display: inline-block;
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* Mobile Grid Layout */
        .grid-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 14px;
        }

        @media (min-width: 640px) {
            .grid-container {
                grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            }
            .header-title, .header-subtitle {
                text-align: center;
                padding-right: 0;
            }
        }

        .brand-card {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            overflow: hidden;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
        }

        .brand-header {
            background: linear-gradient(135deg, rgba(2, 132, 199, 0.08), rgba(56, 189, 248, 0.02));
            padding: 10px 14px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand-icon {
            width: 26px;
            height: 26px;
            background: var(--primary);
            color: white;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }

        .brand-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--primary-dark);
        }

        .dark-mode .brand-title {
            color: #38bdf8;
        }

        /* Ultra Clean Mobile Table Layout */
        .price-table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            font-size: 13.5px;
        }

        .price-table th {
            background: rgba(0, 0, 0, 0.02);
            padding: 7px 8px;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 11.5px;
            border-bottom: 1px solid var(--border-color);
        }

        .dark-mode .price-table th {
            background: rgba(255, 255, 255, 0.02);
        }

        .price-table td {
            padding: 8px 8px;
            border-bottom: 1px solid var(--border-color);
        }

        .price-table tr:last-child td {
            border-bottom: none;
        }

        .badge-piece {
            font-weight: 700;
            color: var(--accent-green);
        }

        .loading-text, .empty-text {
            text-align: center;
            padding: 40px 15px;
            font-size: 15px;
            color: var(--primary);
            grid-column: 1 / -1;
        }

        footer {
            margin-top: 30px;
            text-align: center;
            color: var(--text-muted);
            font-size: 12px;
            padding: 0 10px;
        }
    </style>
</head>
<body>

<header>
    <div class="top-controls">
        <button class="icon-btn" id="themeToggle" title="ডার্ক/লাইট মোড"><i class="fa-solid fa-moon"></i></button>
        <button class="icon-btn" onclick="window.print()" title="প্রিন্ট করুন"><i class="fa-solid fa-print"></i></button>
    </div>
    <div class="header-title">মেসার্স সদর আলী এন্ড সন্স</div>
    <div class="header-subtitle">সুজন গার্মেন্টস - পাইকারি রেট লিস্ট</div>
</header>

<div class="container">
    <!-- Search Section -->
    <div class="search-card">
        <div class="search-box-wrapper">
            <input type="text" id="searchInput" class="search-input" placeholder="খুঁজুন (যেমন: london, 28, মারজান)..." autocomplete="off">
            <button class="clear-btn" id="clearBtn" title="ক্লিয়ার">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <button class="voice-btn" id="voiceBtn" title="কথা বলে খুঁজুন">
                <i class="fa-solid fa-microphone"></i>
            </button>
            <div class="autocomplete-dropdown" id="autocompleteList"></div>
        </div>
        
        <!-- Category Filter Buttons -->
        <div class="filter-tags" id="categoryTags">
            <div class="tag active" onclick="filterCategory('all', this)">সব দেখান</div>
            <div class="tag" onclick="filterCategory('মারজান RN', this)">মারজান RN</div>
            <div class="tag" onclick="filterCategory('মারজান RNS', this)">মারজান RNS</div>
            <div class="tag" onclick="filterCategory('লন্ডন বয় RN', this)">লন্ডন বয় RN</div>
            <div class="tag" onclick="filterCategory('লন্ডন বয় RNS', this)">লন্ডন বয় RNS</div>
            <div class="tag" onclick="filterCategory('কার্নেল গোল্ড RN', this)">কার্নেল গোল্ড RN</div>
            <div class="tag" onclick="filterCategory('কার্নেল গোল্ড RNS', this)">কার্নেল গোল্ড RNS</div>
            <div class="tag" onclick="filterCategory('বিগবস', this)">বিগবস</div>
            <div class="tag" onclick="filterCategory('আনাস জুনিয়র', this)">আনাস জুনিয়র</div>
        </div>
    </div>

    <!-- Stats Bar -->
    <div class="stats-bar">
        <div>
            <span id="resultCount">ডাটা লোড হচ্ছে...</span>
        </div>
        <div>
            <span class="sync-badge" id="syncStatus"><span class="sync-dot"></span> লাইভ</span>
            <span id="listeningStatus" style="color: #ef4444; font-weight: bold; display: none; margin-left:5px;"><i class="fa-solid fa-spinner fa-spin"></i> শুনছি...</span>
        </div>
    </div>

    <!-- Product Cards Grid -->
    <div class="grid-container" id="productGrid">
        <div class="loading-text"><i class="fa-solid fa-spinner fa-spin"></i> গুগল শীট থেকে লোড হচ্ছে...</div>
    </div>

    <footer>
        <p>© ২০২৬ মেসার্স সদর আলী এন্ড সন্স (সুজন গার্মেন্টস)</p>
    </footer>
</div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwaTrytcr8gk8T6xCPhjgI38oJDAAfYDgy2fPWfEGpacvKIP7GWfCjx2RQ_7wjr5fzKrA/exec";

    let productsData = [];
    let currentSelectedCategory = 'all';
    let isInitialLoad = true;

    const PHONETIC_MAP = {
        'london': 'লন্ডন', 'londone': 'লন্ডন', 'londan': 'লন্ডন',
        'boy': 'বয়', 'boi': 'বয়',
        'marjan': 'মারজান', 'marzan': 'মারজান',
        'kernel': 'কার্নেল', 'karnel': 'কার্নেল', 'karnel gold': 'কার্নেল গোল্ড',
        'gold': 'গোল্ড',
        'bigboss': 'বিগবস', 'big': 'বিগ', 'boss': 'বস',
        'anas': 'আনাস',
        'junior': 'জুনিয়র',
        'sada': 'সাদা',
        'rong': 'রং',
        'rn': 'আরএন', 'rns': 'আরএনএস',
        'লন্ডন': 'london', 'বয়': 'boy', 'মারজান': 'marjan',
        'কার্নেল': 'karnel kernel', 'গোল্ড': 'gold', 'বিগবস': 'bigboss',
        'আনাস': 'anas', 'জুনিয়র': 'junior'
    };

    function toBnDigits(str) {
        const bnDigits = ['০','১','২','৩','৪','৫','৬','৭','৮','৯'];
        return String(str || '').replace(/[0-9]/g, w => bnDigits[parseInt(w)]);
    }

    function toEnDigits(str) {
        const enDigits = {'০':'0','১':'1','২':'2','৩':'3','৪':'4','৫':'5','৬':'6','৭':'7','৮':'8','৯':'9'};
        return String(str || '').replace(/[০-৯]/g, w => enDigits[w]);
    }

    function getSearchVariants(text) {
        if (!text) return [];
        let raw = String(text).toLowerCase().trim();
        let variants = new Set();
        variants.add(raw);
        variants.add(toBnDigits(raw));
        variants.add(toEnDigits(raw));

        let words = raw.split(/\s+/);
        let translatedWords = words.map(w => PHONETIC_MAP[w] || w);
        let joinedTranslation = translatedWords.join(' ');
        variants.add(joinedTranslation);
        variants.add(toBnDigits(joinedTranslation));
        variants.add(toEnDigits(joinedTranslation));

        return Array.from(variants);
    }

    function isMatch(targetText, queryText) {
        if (!queryText) return true;
        const qVariants = getSearchVariants(queryText);
        const tVariants = getSearchVariants(targetText);

        return qVariants.some(qVar => {
            let qTokens = qVar.split(/\s+/).filter(Boolean);
            return qTokens.every(qToken => {
                return tVariants.some(tVar => tVar.includes(qToken));
            });
        });
    }

    function processSheetData(rawData) {
        if (!rawData) return [];
        let rows = Array.isArray(rawData) ? rawData : (rawData.data || rawData.items || []);
        if (rows.length === 0) return [];

        const grouped = {};

        rows.forEach(row => {
            if (typeof row !== 'object') return;

            let cleanRow = {};
            Object.keys(row).forEach(k => {
                let cleanKey = k.toLowerCase().trim().replace(/[^a-z0-9_]/g, '');
                cleanRow[cleanKey] = row[k];
            });

            let brandName = row['item_name'] || row['Item_Name'] || row['brand'] || row['Brand'] || row['Item'] || row['item'] || cleanRow['item_name'] || cleanRow['brand'] || cleanRow['item'] || '';
            let category = row['category'] || row['Category'] || cleanRow['category'] || '';
            let size = row['size'] || row['Size'] || cleanRow['size'] || '';
            let dozen = parseFloat(row['dozen_price'] || row['Dozen_Price'] || row['dozen'] || cleanRow['dozen_price'] || cleanRow['dozen'] || 0);
            let piece = parseFloat(row['piece_price'] || row['Piece_Price'] || row['piece'] || cleanRow['piece_price'] || cleanRow['piece'] || 0);

            if (category && brandName && !brandName.toLowerCase().includes(category.toLowerCase())) {
                brandName = `${brandName} ${category}`.trim();
            } else if (!brandName) {
                brandName = category || 'প্রোডাক্ট';
            }

            if (!grouped[brandName]) {
                grouped[brandName] = [];
            }

            grouped[brandName].push({
                size: String(size),
                dozen: dozen,
                piece: piece
            });
        });

        return Object.keys(grouped).map(b => ({
            brand: b,
            items: grouped[b]
        }));
    }

    async function fetchFromGoogleSheet() {
        try {
            const response = await fetch(API_URL);
            const rawData = await response.json();
            productsData = processSheetData(rawData);
            isInitialLoad = false;
            renderProducts(document.getElementById('searchInput').value);
        } catch (error) {
            console.error("কানেকশন সমস্যা:", error);
            if (isInitialLoad) {
                document.getElementById('productGrid').innerHTML = `<div class="empty-text" style="color:#ef4444;"><i class="fa-solid fa-triangle-exclamation"></i> ডাটা লোড করা যায়নি। কানেকশন চেক করুন।</div>`;
                document.getElementById('resultCount').innerText = 'ত্রুটি';
            }
        }
    }

    function renderProducts(filterQuery = '') {
        const grid = document.getElementById('productGrid');
        
        if (productsData.length === 0 && !isInitialLoad) {
            grid.innerHTML = `<div class="empty-text">কোনো প্রোডাক্ট ডাটা পাওয়া যায়নি।</div>`;
            document.getElementById('resultCount').innerText = `ক্যাটাগরি: ০টি`;
            return;
        }

        grid.innerHTML = '';
        let totalCategoriesCount = 0;
        const query = filterQuery.trim();

        productsData.forEach(cat => {
            if (currentSelectedCategory !== 'all' && !isMatch(cat.brand, currentSelectedCategory)) {
                return;
            }

            const filteredItems = cat.items.filter(item => {
                return isMatch(cat.brand, query) || 
                       isMatch(item.size, query) ||
                       isMatch(item.dozen.toString(), query) ||
                       isMatch(item.piece.toString(), query);
            });

            if (filteredItems.length > 0) {
                totalCategoriesCount++;
                const card = document.createElement('div');
                card.className = 'brand-card';

                let rowsHtml = '';
                filteredItems.forEach(item => {
                    let piecePriceFormatted = item.piece > 0 ? `৳ ${Number(item.piece).toFixed(2)}` : '-';
                    let dozenPriceFormatted = item.dozen > 0 ? `৳ ${item.dozen}` : '-';

                    rowsHtml += `
                        <tr>
                            <td><strong>${item.size}</strong></td>
                            <td>${dozenPriceFormatted}</td>
                            <td class="badge-piece">${piecePriceFormatted}</td>
                        </tr>
                    `;
                });

                card.innerHTML = `
                    <div class="brand-header">
                        <div class="brand-icon"><i class="fa-solid fa-shirt"></i></div>
                        <span class="brand-title">${cat.brand}</span>
                    </div>
                    <table class="price-table">
                        <thead>
                            <tr>
                                <th>সাইজ</th>
                                <th>ডজন (৳)</th>
                                <th>পিছ (৳)</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${rowsHtml}
                        </tbody>
                    </table>
                `;
                grid.appendChild(card);
            }
        });

        if (totalCategoriesCount === 0 && !isInitialLoad) {
            grid.innerHTML = `<div class="empty-text"><i class="fa-solid fa-magnifying-glass"></i> "${query}" দিয়ে কোনো রেজাল্ট পাওয়া যায়নি।</div>`;
        }

        document.getElementById('resultCount').innerText = `মোট ক্যাটাগরি: ${totalCategoriesCount}টি`;
    }

    const searchInput = document.getElementById('searchInput');
    const autocompleteList = document.getElementById('autocompleteList');
    const clearBtn = document.getElementById('clearBtn');

    searchInput.addEventListener('input', (e) => {
        const val = e.target.value;
        toggleClearButton(val);
        renderProducts(val);
        showSuggestions(val);
    });

    searchInput.addEventListener('focus', (e) => {
        if (e.target.value.trim()) {
            showSuggestions(e.target.value);
        }
    });

    clearBtn.addEventListener('click', () => {
        searchInput.value = '';
        toggleClearButton('');
        autocompleteList.style.display = 'none';
        renderProducts('');
        searchInput.focus();
    });

    function toggleClearButton(val) {
        clearBtn.style.display = val.trim().length > 0 ? 'flex' : 'none';
    }

    function showSuggestions(val) {
        const query = val.trim();
        if (!query) {
            autocompleteList.style.display = 'none';
            return;
        }

        const suggestionsMap = new Map();

        productsData.forEach(cat => {
            if (isMatch(cat.brand, query)) {
                suggestionsMap.set(cat.brand, { text: cat.brand, fillText: cat.brand, type: 'ক্যাটাগরি' });
            }

            cat.items.forEach(item => {
                if (isMatch(item.size, query)) {
                    let key = `${cat.brand}-${item.size}`;
                    suggestionsMap.set(key, { 
                        text: `${cat.brand} (সাইজ: ${item.size})`, 
                        fillText: cat.brand, 
                        type: 'সাইজ' 
                    });
                }
            });
        });

        const listArray = Array.from(suggestionsMap.values()).slice(0, 6);

        if (listArray.length === 0) {
            autocompleteList.style.display = 'none';
            return;
        }

        autocompleteList.innerHTML = '';
        listArray.forEach(sug => {
            const item = document.createElement('div');
            item.className = 'suggestion-item';
            item.innerHTML = `<span><i class="fa-solid fa-magnifying-glass" style="font-size:11px; margin-right:6px; color:var(--primary);"></i>${sug.text}</span> <span class="suggestion-badge">${sug.type}</span>`;
            
            item.addEventListener('click', () => {
                searchInput.value = sug.fillText;
                toggleClearButton(sug.fillText);
                autocompleteList.style.display = 'none';
                renderProducts(sug.fillText);
            });
            autocompleteList.appendChild(item);
        });

        autocompleteList.style.display = 'block';
    }

    document.addEventListener('click', (e) => {
        if (!e.target.closest('.search-box-wrapper')) {
            autocompleteList.style.display = 'none';
        }
    });

    // Voice Search
    const voiceBtn = document.getElementById('voiceBtn');
    const listeningStatus = document.getElementById('listeningStatus');

    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recognition = new SpeechRecognition();
        recognition.lang = 'bn-BD';
        recognition.interimResults = false;

        voiceBtn.addEventListener('click', () => {
            recognition.start();
        });

        recognition.onstart = () => {
            voiceBtn.classList.add('listening');
            listeningStatus.style.display = 'inline-block';
        };

        recognition.onend = () => {
            voiceBtn.classList.remove('listening');
            listeningStatus.style.display = 'none';
        };

        recognition.onresult = (event) => {
            const transcript = event.results[0][0].transcript;
            searchInput.value = transcript;
            toggleClearButton(transcript);
            autocompleteList.style.display = 'none';
            renderProducts(transcript);
        };
    } else {
        voiceBtn.onclick = () => {
            alert('আপনার ব্রাউজার ভয়েস সার্চ সাপোর্ট করছে না। Chrome ব্রাউজার ব্যবহার করুন।');
        };
    }

    function filterCategory(catName, element) {
        currentSelectedCategory = catName;
        document.querySelectorAll('.tag').forEach(t => t.classList.remove('active'));
        element.classList.add('active');
        renderProducts(searchInput.value);
    }

    // Dark/Light Theme Switcher
    const themeToggle = document.getElementById('themeToggle');
    themeToggle.addEventListener('click', () => {
        document.body.classList.toggle('dark-mode');
        const isDark = document.body.classList.contains('dark-mode');
        themeToggle.innerHTML = isDark ? '<i class="fa-solid fa-sun"></i>' : '<i class="fa-solid fa-moon"></i>';
    });

    fetchFromGoogleSheet();
    setInterval(fetchFromGoogleSheet, 10000);
</script>
</body>
</html>
