<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>মেসার্স সদর আলী এন্ড সন্স - ডিজিটাল ক্যাটালগ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="preconnect" href="https://script.google.com">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- পিডব্লিউএ এবং সার্ভিস ওয়ার্কার কনফিগারেশন যোগ করা হয়েছে -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0284c7">
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('Service Worker registered!'))
            .catch(err => console.log('Service Worker error:', err));
        });
      }
    </script>

    <style>
        :root{--primary:#0284c7;--primary-dark:#0369a1;--accent:#38bdf8;--bg-light:#f8fafc;--card-bg:#ffffff;--text-main:#0f172a;--text-muted:#64748b;--border-color:#e2e8f0;--accent-green:#10b981;--shadow-sm:0 2px 4px rgba(0,0,0,0.04);--shadow-lg:0 12px 30px rgba(0,0,0,0.15);--radius-lg:14px}
        body.dark-mode{--bg-light:#0f172a;--card-bg:#1e293b;--text-main:#f8fafc;--text-muted:#94a3b8;--border-color:#334155;--shadow-sm:0 2px 4px rgba(0,0,0,0.2);--shadow-lg:0 12px 30px rgba(0,0,0,0.4)}
        *{box-sizing:border-box;margin:0;padding:0;font-family:'Hind Siliguri',sans-serif;-webkit-tap-highlight-color:transparent;transition:background-color .25s,color .25s,border-color .25s}
        body{background-color:var(--bg-light);color:var(--text-main);padding-bottom:40px}
        header{background:linear-gradient(135deg,#0284c7,#0f172a);color:#fff;padding:18px 14px;text-align:center;box-shadow:0 4px 15px rgba(0,0,0,0.12);position:relative}
        .header-content{cursor:pointer;display:inline-block;text-align:center;width:100%}
        .header-title{font-size:20px;font-weight:700;line-height:1.2;margin-bottom:2px;text-align:center}
        .header-subtitle{font-size:12px;opacity:.9;font-weight:400;text-align:center}

        /* প্রিমিয়াম স্লাইডিং সাইডবার মেনু স্টাইল (ডান দিক থেকে স্ক্রীন জুড়ে উপর থেকে নিচ পর্যন্ত) */
        .top-controls{position:absolute;top:14px;right:12px;display:flex;align-items:center;z-index:100}
        .menu-toggle-btn{background:rgba(255,255,255,0.2);border:1px solid rgba(255,255,255,0.3);color:#fff;width:38px;height:38px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;backdrop-filter:blur(8px);transition:transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), background 0.3s ease;box-shadow:0 4px 10px rgba(0,0,0,0.15);z-index:102;}
        .menu-toggle-btn:active{transform:scale(0.88)}

        /* ওভারলে ব্যাকড্রপ */
        .sidebar-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);backdrop-filter:blur(4px);z-index:99;opacity:0;visibility:hidden;transition:all 0.3s ease;}
        .sidebar-overlay.active{opacity:1;visibility:visible;}

        /* সাইডবার প্যানেল */
        .menu-dropdown{position:fixed;top:0;right:-280px;width:280px;height:100vh;background:var(--card-bg);border-left:1px solid var(--border-color);box-shadow:-5px 0 25px rgba(0,0,0,0.2);padding:70px 16px 20px 16px;display:flex;flex-direction:column;gap:10px;transition:right 0.35s cubic-bezier(0.16, 1, 0.3, 1);z-index:101;overflow-y:auto;}
        .menu-dropdown.active{right:0;}

        .menu-item{background:transparent;border:none;color:var(--text-main);padding:12px 14px;border-radius:12px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;font-size:14.5px;font-weight:500;text-align:left;width:100%;transition:background 0.2s;}
        .menu-item:hover{background:var(--bg-light)}
        .dark-mode .menu-item:hover{background:rgba(255,255,255,0.06)}
        .menu-item-content {display:flex;align-items:center;gap:12px;}
        .menu-item i{width:20px;text-align:center;color:var(--primary)}

        /* ছবির মতো সুইচ ডিজাইন (Toggle Switch) */
        .toggle-switch{position:relative;width:48px;height:26px;background:#dc2626;border-radius:20px;cursor:pointer;transition:background 0.3s ease;box-shadow:inset 0 2px 4px rgba(0,0,0,0.2);display:inline-flex;align-items:center;padding:2px;}
        .toggle-switch.active{background:#16a34a;}
        .toggle-thumb{width:22px;height:22px;background:#ffffff;border-radius:50%;box-shadow:0 2px 5px rgba(0,0,0,0.3);transform:translateX(0);transition:transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);position:absolute;}
        .toggle-switch.active .toggle-thumb{transform:translateX(22px);}
        .toggle-label{font-size:10px;font-weight:700;color:#fff;position:absolute;width:100%;text-align:center;pointer-events:none;letter-spacing:0.5px;}
        .toggle-switch.active .off-text{opacity:0;}
        .toggle-switch:not(.active) .on-text{opacity:0;}
        .on-text{left:4px;}
        .off-text{right:6px;}

        .container{max-width:1100px;margin:0 auto;padding:12px}
        .search-card{background:var(--card-bg);border-radius:var(--radius-lg);padding:12px;box-shadow:var(--shadow-sm);border:1px solid var(--border-color);margin-bottom:14px;position:sticky;top:8px;z-index:9;backdrop-filter:blur(10px)}
        .search-box-wrapper{position:relative;width:100%;margin-bottom:10px}
        .search-input{width:100%;padding:12px 82px 12px 14px;font-size:15px;border:1.5px solid var(--border-color);border-radius:10px;background:var(--card-bg);color:var(--text-main);outline:none}
        .search-input:focus{border-color:var(--primary)}
        .clear-btn{position:absolute;right:46px;top:50%;transform:translateY(-50%);background:transparent;color:var(--text-muted);border:none;width:30px;height:30px;border-radius:50%;cursor:pointer;display:none;align-items:center;justify-content:center;font-size:14px;z-index:2}
        .voice-btn{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:var(--primary);color:#fff;border:none;width:34px;height:34px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;z-index:2}
        .voice-btn.listening{background:#ef4444;animation:pulse 1.2s infinite}
        @keyframes pulse{0%{transform:translateY(-50%) scale(1)}50%{transform:translateY(-50%) scale(1.08)}100%{transform:translateY(-50%) scale(1)}}
        .autocomplete-dropdown{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--card-bg);border:1px solid var(--border-color);border-radius:10px;box-shadow:0 8px 20px rgba(0,0,0,0.15);z-index:1000;max-height:220px;overflow-y:auto;display:none}
        .suggestion-item{padding:10px 14px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-size:13.5px;border-bottom:1px solid var(--border-color)}
        .suggestion-item:last-child{border-bottom:none}
        .suggestion-badge{font-size:10px;padding:2px 7px;background:var(--border-color);border-radius:10px;color:var(--text-muted)}
        .filter-wrapper{position:relative;display:flex;align-items:center;}
        .filter-tags{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scroll-behavior:smooth;scrollbar-width:none;-webkit-overflow-scrolling:touch;width:100%;}
        .filter-tags::-webkit-scrollbar{display:none}
        .scroll-arrow{background:var(--card-bg);border:1px solid var(--border-color);color:var(--text-main);width:28px;height:32px;border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;z-index:5;flex-shrink:0;box-shadow:var(--shadow-sm);}
        .scroll-arrow.left{margin-right:4px;}
        .scroll-arrow.right{margin-left:4px;}
        .tag{padding:6px 14px;background:var(--bg-light);color:var(--text-main);border:1px solid var(--border-color);border-radius:16px;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap;user-select:none;flex-shrink:0}
        .tag.active{background:var(--primary);color:#fff;border-color:var(--primary)}
        .stats-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:12.5px;color:var(--text-muted);padding:0 2px;flex-wrap:wrap;gap:6px}
        .sync-badge{display:inline-flex;align-items:center;gap:5px;background:rgba(16,185,129,0.12);color:var(--accent-green);padding:3px 9px;border-radius:12px;font-size:11.5px;font-weight:600}
        .sync-dot{width:6px;height:6px;background-color:var(--accent-green);border-radius:50%;display:inline-block;animation:blink 1.5s infinite}
        @keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}
        .grid-container{display:grid;grid-template-columns:1fr;gap:14px}
        @media(min-width:640px){.grid-container{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}}
        .brand-card{background:var(--card-bg);border-radius:var(--radius-lg);overflow:hidden;border:1px solid var(--border-color);box-shadow:var(--shadow-sm)}
        .brand-header{background:linear-gradient(135deg,rgba(2,132,199,0.08),rgba(56,189,248,0.02));padding:10px 14px;border-bottom:1px solid var(--border-color);display:flex;align-items:center;gap:8px}
        .brand-icon{width:26px;height:26px;background:var(--primary);color:#fff;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px}
        .brand-title{font-size:15px;font-weight:700;color:var(--primary-dark)}
        .dark-mode .brand-title{color:#38bdf8}
        .price-table{width:100%;border-collapse:collapse;text-align:center;font-size:13.5px}
        .price-table th{background:rgba(0,0,0,0.02);padding:7px 8px;color:var(--text-muted);font-weight:600;font-size:11.5px;border-bottom:1px solid var(--border-color)}
        .dark-mode .price-table th{background:rgba(255,255,255,0.02)}
        .price-table td{padding:8px;border-bottom:1px solid var(--border-color)}
        .price-table tr:last-child td{border-bottom:none}
        .badge-piece{font-weight:700;color:var(--accent-green)}
        .empty-text{text-align:center;padding:40px 15px;font-size:15px;color:var(--primary);grid-column:1 / -1}
        .skeleton-card{background:var(--card-bg);border-radius:var(--radius-lg);border:1px solid var(--border-color);padding:14px;overflow:hidden}
        .skeleton-block{background:linear-gradient(90deg,var(--border-color) 25%,rgba(200,200,200,0.15) 37%,var(--border-color) 63%);background-size:400% 100%;animation:skeleton-shimmer 1.4s ease infinite;border-radius:6px}
        @keyframes skeleton-shimmer{0%{background-position:100% 50%}100%{background-position:0 50%}}
        .skeleton-header{height:22px;width:60%;margin-bottom:14px}
        .skeleton-row{height:16px;width:100%;margin-bottom:10px}
        footer{margin-top:30px;text-align:center;color:var(--text-muted);font-size:12px;padding:0 10px}
    </style>
</head>
<body>
<header>
    <!-- ব্যাকড্রপ ওভারলে -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- ডান পাশের স্লাইডিং মেনু বার ও ড্রপডাউন -->
    <div class="top-controls">
        <button class="menu-toggle-btn" id="menuToggleBtn" title="মেনু"><i class="fa-solid fa-list-dots"></i></button>
        <div class="menu-dropdown" id="menuDropdown">
            <button class="menu-item" id="themeToggle">
                <div class="menu-item-content"><i class="fa-solid fa-moon" id="themeIcon"></i> <span id="themeText">ডার্ক মোড</span></div>
                <div class="toggle-switch" id="themeSwitch">
                    <span class="toggle-label on-text">ON</span>
                    <span class="toggle-label off-text">OFF</span>
                    <div class="toggle-thumb"></div>
                </div>
            </button>
            <button class="menu-item" onclick="window.print(); closeMenu();">
                <div class="menu-item-content"><i class="fa-solid fa-print"></i> প্রিন্ট করুন</div>
            </button>
            <!-- ভবিষ্যতে নতুন অপশন এখানে যুক্ত করতে পারবেন -->
        </div>
    </div>

    <!-- হেডার টেক্সট (মাঝখানে বিন্যস্ত) -->
    <div class="header-content" onclick="goHome()" title="হোমে যান">
        <div class="header-title">মেসার্স সদর আলী এন্ড সন্স</div>
        <div class="header-subtitle">সুজন গার্মেন্টস - পাইকারি রেট লিস্ট</div>
    </div>
</header>

<div class="container">
    <div class="search-card">
        <div class="search-box-wrapper">
            <input type="text" id="searchInput" class="search-input" placeholder="খুঁজুন (যেমন: london, 28, মারজান)..." autocomplete="off">
            <button class="clear-btn" id="clearBtn" title="ক্লিয়ার"><i class="fa-solid fa-xmark"></i></button>
            <button class="voice-btn" id="voiceBtn" title="কথা বলে খুঁজুন"><i class="fa-solid fa-microphone"></i></button>
            <div class="autocomplete-dropdown" id="autocompleteList"></div>
        </div>
        <div class="filter-wrapper">
            <button class="scroll-arrow left" onclick="scrollTags('left')"><i class="fa-solid fa-chevron-left"></i></button>
            <div class="filter-tags" id="categoryTags">
                <div class="tag active" onclick="filterCompany('all', this)">সব দেখান</div>
            </div>
            <button class="scroll-arrow right" onclick="scrollTags('right')"><i class="fa-solid fa-chevron-right"></i></button>
        </div>
    </div>
    <div class="stats-bar">
        <div><span id="resultCount">ডাটা লোড হচ্ছে...</span></div>
        <div style="display:flex;align-items:center;gap:8px;">
            <span class="sync-badge" id="syncStatus"><span class="sync-dot"></span> লাইভ</span>
            <span id="listeningStatus" style="color:#ef4444;font-weight:bold;display:none;"><i class="fa-solid fa-spinner fa-spin"></i> শুনছি...</span>
        </div>
    </div>
    <div class="grid-container" id="productGrid"></div>
    <footer><p>© ২০২৬ মেসার্স সদর আলী এন্ড সন্স (সুজন গার্মেন্টস) <span id="lastUpdated"></span></p></footer>
</div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwaTrytcr8gk8T6xCPhjgI38oJDAAfYDgy2fPWfEGpacvKIP7GWfCjx2RQ_7wjr5fzKrA/exec";
    const CACHE_KEY = "sodor_ali_catalog_cache_v3";
    let rawSheetData = [], currentSelectedCompany = 'all', isInitialLoad = true, lastFetchedRawJsonStr = "";

    const PHONETIC_MAP = {
        'london':'লন্ডন','londone':'londone','londan':'লন্ডন','boy':'বয়','boi':'বয়','marjan':'মারজান','marzan':'মারজান',
        'kernel':'কার্নেল','karnel':'কার্নেল','kornel':'কার্নেল','karnelgold':'কার্নেল গোল্ড','kornelgold':'কার্নেল গোল্ড','kernelgold':'কার্নেল গোল্ড',
        'gold':'গোল্ড','bigboss':'বিগবস','big':'big','boss':'বস','anas':'আনাস','junior':'জুনিয়র','sada':'সাদা','rong':'রং',
        'rn':'আরএন','rns':'আরএনএস','লন্ডন':'london','বয়':'boy','মারজান':'marjan','কার্নেল':'kernel karnel kornel',
        'গোল্ড':'gold','বিগবস':'bigboss','আনাস':'anas','জুনিয়র':'junior'
    };

    function toBnDigits(s){return String(s||'').replace(/[0-9]/g,w=>'০১২৩৪৫৬৭৮৯'[w]);}
    function toEnDigits(s){return String(s||'').replace(/[০-৯]/g,w=>{let d={'০':'0','১':'1','২':'2','৩':'3','৪':'4','৫':'5','৬':'6','৭':'7','৮':'8','৯':'9'};return d[w];});}

    function getSearchVariants(text){
        if(!text)return[];
        let raw=String(text).toLowerCase().trim(),variants=new Set([raw,toBnDigits(raw),toEnDigits(raw),raw.replace(/\s+/g,'')]);
        let words=raw.split(/\s+/),trans=words.map(w=>PHONETIC_MAP[w]||w).join(' ');
        variants.add(trans);variants.add(toBnDigits(trans));variants.add(toEnDigits(trans));variants.add(trans.replace(/\s+/g,''));
        words.forEach(w=>{if(PHONETIC_MAP[w])variants.add(PHONETIC_MAP[w]);});
        return Array.from(variants);
    }

    function isMatch(target,query){
        if(!query)return true;
        let qVars=getSearchVariants(query),tVars=getSearchVariants(target);
        return qVars.some(q=>q.split(/\s+/).filter(Boolean).every(tok=>tVars.some(t=>t.includes(tok))));
    }

    function processSheetData(rawData){
        if(!rawData)return[];
        let rows=Array.isArray(rawData)?rawData:(rawData.data||rawData.items||[]);
        if(!rows.length)return[];
        const grouped={};
        rows.forEach(row=>{
            if(typeof row!=='object')return;
            let c={};
            Object.keys(row).forEach(k=>c[k.toLowerCase().trim().replace(/[^a-z0-9_]/g,'')]=row[k]);
            let comp=row['item_name']||row['Item_Name']||c['item_name']||c['brand']||'অন্যান্য';
            let cat=row['category']||row['Category']||c['category']||'';
            let size=row['size']||row['Size']||c['size']||'';
            let dozen=parseFloat(row['dozen_price']||row['Dozen_Price']||row['dozen']||c['dozen_price']||c['dozen']||0);
            let piece=parseFloat(row['piece_price']||row['Piece_Price']||row['piece']||c['piece_price']||c['piece']||0);
            let title=cat?`${comp} ${cat}`:comp;
            if(!grouped[title])grouped[title]={company:comp.trim(),category:cat.trim(),items:[]};
            grouped[title].items.push({size:String(size),dozen,piece});
        });
        return Object.keys(grouped).map(t=>({cardTitle:t,company:grouped[t].company,category:grouped[t].category,items:grouped[t].items}));
    }

    function renderSkeletonLoader(){
        let html='';for(let i=0;i<4;i++)html+=`<div class="skeleton-card"><div class="skeleton-block skeleton-header"></div><div class="skeleton-block skeleton-row"></div><div class="skeleton-block skeleton-row"></div></div>`;
        document.getElementById('productGrid').innerHTML=html;
    }

    function updateTimestamp(dateStr){
        if(dateStr)document.getElementById('lastUpdated').innerText=`| সর্বশেষ আপডেট: ${toBnDigits(dateStr)}`;
    }

    function renderCompanyTags(){
        const container=document.getElementById('categoryTags');
        const comps=[...new Set(rawSheetData.map(i=>i.company))];
        let html=`<div class="tag ${currentSelectedCompany==='all'?'active':''}" onclick="filterCompany('all', this)">সব দেখান</div>`;
        comps.forEach(comp=>html+=`<div class="tag ${currentSelectedCompany===comp?'active':''}" onclick="filterCompany('${comp}',this)">${comp}</div>`);
        container.innerHTML=html;
    }

    function scrollTags(dir){
        document.getElementById('categoryTags').scrollBy({left:dir==='left'?-200:200,behavior:'smooth'});
    }

    function loadFromCache(){
        try{
            let cached=localStorage.getItem(CACHE_KEY);
            if(cached){
                let p=JSON.parse(cached);
                if(p&&p.data&&p.data.length){
                    rawSheetData=processSheetData(p.data);
                    if(p.lastUpdated)updateTimestamp(p.lastUpdated);
                    isInitialLoad=false;renderCompanyTags();renderProducts(document.getElementById('searchInput').value);
                }
            }
        }catch(e){}
    }

    async function fetchFromGoogleSheet(){
        if(isInitialLoad && !rawSheetData.length) {
            renderSkeletonLoader();
        }
        try{
            let res=await fetch(API_URL),raw=await res.json(),jsonStr=JSON.stringify(raw);
            let sheetDate=raw.lastUpdated||raw.last_updated||raw.updatedAt||raw.date;
            let rows=Array.isArray(raw)?raw:(raw.data||raw.items||[]);
            if(jsonStr===lastFetchedRawJsonStr&&!isInitialLoad){if(sheetDate)updateTimestamp(sheetDate);return;}
            lastFetchedRawJsonStr=jsonStr;rawSheetData=processSheetData(rows);
            if(sheetDate)updateTimestamp(sheetDate);
            try{localStorage.setItem(CACHE_KEY,JSON.stringify({data:rows,lastUpdated:sheetDate||""}));}catch(e){}
            isInitialLoad=false;renderCompanyTags();renderProducts(document.getElementById('searchInput').value);
        }catch(err){
            if(isInitialLoad&&!rawSheetData.length)document.getElementById('productGrid').innerHTML=`<div class="empty-text" style="color:#ef4444;"><i class="fa-solid fa-triangle-exclamation"></i> ডাটা লোড করা যায়নি।</div>`;
        }
    }

    function renderProducts(query=''){
        const grid=document.getElementById('productGrid');
        if(!rawSheetData.length&&!isInitialLoad){grid.innerHTML=`<div class="empty-text">কোনো প্রোডাক্ট ডাটা পাওয়া যায়নি।</div>`;document.getElementById('resultCount').innerText=`কার্ড: ০টি`;return;}
        let frag=document.createDocumentFragment(),total=0,q=query.trim();
        rawSheetData.forEach(card=>{
            if(currentSelectedCompany!=='all'&&card.company!==currentSelectedCompany)return;
            let isCardMatched=isMatch(card.cardTitle,q)||isMatch(card.company,q)||isMatch(card.category,q);
            let itemsToShow=isCardMatched?card.items:card.items.filter(i=>isCardMatched||isMatch(i.size,q)||isMatch(i.dozen.toString(),q)||isMatch(i.piece.toString(),q));
            if(itemsToShow.length){
                total++;let div=document.createElement('div');div.className='brand-card';
                let rows='';itemsToShow.forEach(i=>{
                    rows+=`<tr><td><strong>${i.size}</strong></td><td>${i.dozen>0?`৳ ${i.dozen}`:'-'}</td><td class="badge-piece">${i.piece>0?`৳ ${Number(i.piece).toFixed(2)}`:'-'}</td></tr>`;
                });
                div.innerHTML=`<div class="brand-header"><div class="brand-icon"><i class="fa-solid fa-shirt"></i></div><span class="brand-title">${card.cardTitle}</span></div><table class="price-table"><thead><tr><th>সাইজ</th><th>ডজন (৳)</th><th>পিছ (৳)</th></tr></thead><tbody>${rows}</tbody></table>`;
                frag.appendChild(div);
            }
        });
        grid.innerHTML='';if(total)grid.appendChild(frag);else if(!isInitialLoad)grid.innerHTML=`<div class="empty-text"><i class="fa-solid fa-magnifying-glass"></i> "${q}" দিয়ে কোনো রেজাল্ট পাওয়া যায়নি।</div>`;
        document.getElementById('resultCount').innerText=`মোট কার্ড: ${total}টি`;
    }

    const searchInput=document.getElementById('searchInput'),autocompleteList=document.getElementById('autocompleteList'),clearBtn=document.getElementById('clearBtn');
    function debounce(fn,delay=100){let t;return(...args)=>{clearTimeout(t);t=setTimeout(()=>fn.apply(this,args),delay);};}
    const handleInput=debounce(val=>{renderProducts(val);showSuggestions(val);},80);
    searchInput.addEventListener('input',e=>{toggleClearButton(e.target.value);handleInput(e.target.value);});
    searchInput.addEventListener('focus',e=>{if(e.target.value.trim())showSuggestions(e.target.value);});
    clearBtn.addEventListener('click',()=>{searchInput.value='';toggleClearButton('');autocompleteList.style.display='none';renderProducts('');searchInput.focus();});
    function toggleClearButton(val){clearBtn.style.display=val.trim()?'flex':'none';}

    function showSuggestions(val){
        let q=val.trim();if(!q){autocompleteList.style.display='none';return;}
        let map=new Map();
        rawSheetData.forEach(card=>{
            if(isMatch(card.company,q))map.set(card.company,{text:card.company,fillText:card.company,type:'কোম্পানি'});
            if(isMatch(card.cardTitle,q))map.set(card.cardTitle,{text:card.cardTitle,fillText:card.cardTitle,type:'ক্যাটাগরি'});
            card.items.forEach(i=>{if(isMatch(i.size,q))map.set(`${card.cardTitle}-${i.size}`,{text:`${card.cardTitle} (সাইজ: ${i.size})`,fillText:card.cardTitle,type:'সাইজ'});});
        });
        let arr=Array.from(map.values()).slice(0,6);
        if(!arr.length){autocompleteList.style.display='none';return;}
        autocompleteList.innerHTML='';
        arr.forEach(s=>{
            let item=document.createElement('div');item.className='suggestion-item';
            item.innerHTML=`<span><i class="fa-solid fa-magnifying-glass" style="font-size:11px;margin-right:6px;color:var(--primary);"></i>${s.text}</span> <span class="suggestion-badge">${s.type}</span>`;
            item.addEventListener('click',()=>{searchInput.value=s.fillText;toggleClearButton(s.fillText);autocompleteList.style.display='none';renderProducts(s.fillText);});
            autocompleteList.appendChild(item);
        });
        autocompleteList.style.display='block';
    }

    document.addEventListener('click',e=>{
        if(!e.target.closest('.search-box-wrapper'))autocompleteList.style.display='none';
    });

    const voiceBtn=document.getElementById('voiceBtn'),listeningStatus=document.getElementById('listeningStatus');
    if('webkitSpeechRecognition' in window||'SpeechRecognition' in window){
        const Rec=window.SpeechRecognition||window.webkitSpeechRecognition,rec=new Rec();
        rec.lang='bn-BD';rec.interimResults=true;rec.continuous=false;let finalTrans='';
        voiceBtn.addEventListener('click',()=>{finalTrans='';try{rec.start();}catch(e){}});
        rec.onstart=()=>{voiceBtn.classList.add('listening');listeningStatus.style.display='inline-block';};
        rec.onend=()=>{voiceBtn.classList.remove('listening');listeningStatus.style.display='none';if(finalTrans.trim())procVoice(finalTrans);};
        rec.onerror=()=>{voiceBtn.classList.remove('listening');listeningStatus.style.display='none';};
        rec.onresult=e=>{
            let interim='';
            for(let i=e.resultIndex;i<e.results.length;++i)if(e.results[i].isFinal)finalTrans+=e.results[i][0].transcript;else interim+=e.results[i][0].transcript;
            let text=finalTrans||interim;
            if(text){searchInput.value=text;toggleClearButton(text);renderProducts(text);showSuggestions(text);}
        };
        function procVoice(t){let cl=t.trim();searchInput.value=cl;toggleClearButton(cl);autocompleteList.style.display='none';currentSelectedCompany='all';renderCompanyTags();renderProducts(cl);}
    }else{voiceBtn.onclick=()=>alert('ব্রাউজার ভয়েস সার্চ সাপোর্ট করে না।');}

    function filterCompany(name,el){
        currentSelectedCompany=name;document.querySelectorAll('.tag').forEach(t=>t.classList.remove('active'));
        if(el)el.classList.add('active');renderProducts(searchInput.value);
    }

    // স্লাইডিং সাইডবার মেনু টগল ও বন্ধ করার ফাংশন
    const menuToggleBtn = document.getElementById('menuToggleBtn');
    const menuDropdown = document.getElementById('menuDropdown');
    const sidebarOverlay = document.getElementById('sidebarOverlay');

    function openMenu(){
        menuDropdown.classList.add('active');
        sidebarOverlay.classList.add('active');
    }

    function closeMenu(){
        menuDropdown.classList.remove('active');
        sidebarOverlay.classList.remove('active');
    }

    menuToggleBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if(menuDropdown.classList.contains('active')){
            closeMenu();
        } else {
            openMenu();
        }
    });

    sidebarOverlay.addEventListener('click', () => {
        closeMenu();
    });

    // ডার্ক মোড টগল ফাংশন ও সুইচ আপডেট
    const themeToggle = document.getElementById('themeToggle');
    const themeIcon = document.getElementById('themeIcon');
    const themeText = document.getElementById('themeText');
    const themeSwitch = document.getElementById('themeSwitch');

    themeToggle.addEventListener('click', (e) => {
        e.stopPropagation();
        document.body.classList.toggle('dark-mode');
        let isDark = document.body.classList.contains('dark-mode');
        themeIcon.className = isDark ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
        themeText.innerText = isDark ? 'লাইট মোড' : 'ডার্ক মোড';
        if(isDark) {
            themeSwitch.classList.add('active');
        } else {
            themeSwitch.classList.remove('active');
        }
    });

    // হোম বাটন ফাংশন
    function goHome(){
        searchInput.value = '';
        toggleClearButton('');
        autocompleteList.style.display = 'none';
        currentSelectedCompany = 'all';
        renderCompanyTags();
        fetchFromGoogleSheet();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    loadFromCache();
    fetchFromGoogleSheet();
    setInterval(fetchFromGoogleSheet, 4000);
</script>
</body>
</html>
